services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: iotdb
      POSTGRES_USER: iotuser
      POSTGRES_PASSWORD: iotpass
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "8000:8000"
    # Para hot-reload de código durante o dev no Windows, você pode habilitar:
    # volumes:
    #   - ./backend:/app

volumes:
  dbdata:
